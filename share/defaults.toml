# OmaBackups — defaults. Overlay: ~/.config/omarchy-backups/config.toml
# then /etc/omarchy-backups/config.toml
#
# Everything in this file is read and acted on. Settings that looked
# adjustable but were not have been removed rather than left to mislead:
# what gets backed up is the skip list (Settings → Skip), how often is the
# Automatic backups switch, and how long restore points are kept is the
# Smart thinning switch.

[paths]
mountpoint = "/run/omarchy-backups"
source_toplevel = "/run/omarchy-backups-src"
source_snap_subvol = "@omarchy-backups-src"

[layout]
efi_size = "1G"
efi_label = "OMABOOT"
live_size = "16G"
live_label = "OmaRescue"
tm_label = "OmaBackups"
luks_mapper = "omarchy-backups"

[restore_layout]
esp_size = "2G"
luks_mapper = "omarchy-restore"

[backup]
# Rescue kernel refresh is noisy and slow; do it from `oma-backups refresh-rescue`.
refresh_rescue_boot = false
